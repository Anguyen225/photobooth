<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Photobooth Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-cream: #F5ECDD;
      --color-gold: #E8B84B;
      --color-red: #C4453A;
      --color-dark: #170F13;
      --color-panel: #241720;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0a0d 0%, #1a0f14 50%, #0d0a0f 100%);
      overflow: hidden;
    }
    .display-font { font-family: 'Playfair Display', serif; }
    .screen { animation: fadeIn 0.5s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(0.8); } }
    @keyframes slide-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .float-animation { animation: float 3s ease-in-out infinite; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .countdown-pop { animation: pop 0.7s ease both; }
    .slide-down { animation: slide-down 0.3s ease; }
    
    /* Film sprockets */
    .sprocket-hole { 
      width: 12px; height: 12px; 
      background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.1));
      border-radius: 2px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(232, 184, 75, 0.3); border-radius: 3px; }
    
    /* Background decoration */
    .bg-decoration {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .decoration-circle {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 184, 75, 0.15), transparent);
    }
  </style>
</head>
<body class="bg-gray-950">
  <!-- Background decorations -->
  <div class="bg-decoration">
    <div class="decoration-circle w-96 h-96 -top-48 -left-48 animate-pulse" style="animation-duration: 8s;"></div>
    <div class="decoration-circle w-80 h-80 -bottom-40 -right-40 animate-pulse" style="animation-duration: 10s; animation-delay: 1s;"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/30"></div>
  </div>

  <div id="app" class="relative z-10 min-h-screen flex flex-col" 
    x-data="photoboothApp()"
    x-init="init()">

    <!-- ===== START SCREEN ===== -->
    <div id="start-screen" class="screen flex-1 flex flex-col items-center justify-center px-6 py-8"
      x-show="currentScreen === 'start'" 
      @click.away="currentScreen === 'start'">
      
      <!-- Header with animation -->
      <div class="text-center mb-8 slide-down">
        <div class="display-font text-5xl font-bold text-amber-100 mb-2 float-animation">
          📸 PHOTOBOOTH
        </div>
        <p class="text-amber-200/60 text-sm tracking-widest uppercase">Bắt khoảnh khắc quý giá</p>
      </div>

      <!-- Frame preview with gradient -->
      <div class="mb-8 animate-bounce" style="animation-duration: 3s;">
        <div class="w-32 h-40 rounded-2xl bg-gradient-to-br from-amber-900/40 to-red-900/30 border-2 border-amber-500/40 flex items-center justify-center backdrop-blur-sm hover:border-amber-400/60 transition">
          <i class="ti ti-camera text-amber-300 text-5xl opacity-80"></i>
        </div>
      </div>

      <!-- Main CTA -->
      <button @click="requestCameraAndEnter()"
        class="px-8 py-3 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-gray-900 font-semibold text-lg hover:from-amber-300 hover:to-amber-400 active:scale-95 transition mb-4 shadow-lg hover:shadow-amber-500/50">
        <i class="ti ti-camera-plus inline mr-2"></i> Bật Camera Ngay
      </button>
      
      <p class="text-amber-200/50 text-xs max-w-xs text-center leading-relaxed">
        📱 Dùng camera điện thoại | 🔒 Ảnh lưu trên máy bạn | 🚀 Nhanh & dễ dàng
      </p>

      <!-- Error display -->
      <template x-if="errorMessage">
        <div class="mt-8 w-full max-w-md p-4 rounded-xl bg-red-950/40 border border-red-500/30 text-red-200 text-sm slide-down">
          <p class="font-semibold mb-2"><i class="ti ti-alert-triangle inline mr-2"></i> <span x-text="errorMessage"></span></p>
          <ul class="ml-6 space-y-1 text-xs" x-show="errorSteps.length" style="display: none;">
            <template x-for="step in errorSteps" :key="step">
              <li>• <span x-html="step"></span></li>
            </template>
          </ul>
          <button @click="errorMessage = ''; errorSteps = []"
            class="mt-3 px-4 py-2 bg-amber-500 text-gray-900 rounded-lg text-xs font-semibold hover:bg-amber-400">
            Thử lại
          </button>
        </div>
      </template>
    </div>

    <!-- ===== CAMERA SCREEN ===== -->
    <div id="camera-screen" class="screen flex-1 flex flex-col px-3 py-3 gap-2"
      x-show="currentScreen === 'camera'">
      
      <!-- Film strip container -->
      <div class="flex-1 flex gap-2 rounded-2xl overflow-hidden bg-black/80 backdrop-blur-sm border border-amber-500/20">
        <!-- Left sprockets -->
        <div class="flex flex-col justify-between py-2 px-1 bg-black/40">
          <template x-for="i in 8" :key="i">
            <div class="sprocket-hole"></div>
          </template>
        </div>

        <!-- Video stage -->
        <div class="flex-1 relative bg-black overflow-hidden rounded-lg">
          <video id="video" autoplay playsinline muted 
            class="w-full h-full object-cover transition-all"
            :class="{'scale-x-[-1]': isMirrored}"></video>
          
          <!-- Shot counter -->
          <template x-if="mode === 'strip3'">
            <div class="absolute top-3 left-3 px-3 py-1 rounded-full bg-black/60 backdrop-blur border border-amber-500/40 text-amber-200 text-xs font-bold">
              📷 <span x-text="`${shots.length + 1} / 3`"></span>
            </div>
          </template>

          <!-- Countdown -->
          <div id="countdown" class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div x-show="showCountdown" class="display-font text-8xl font-bold text-amber-100 text-shadow countdown-pop"
              x-text="countdownNumber" style="display: none;"></div>
          </div>

          <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <!-- Right sprockets -->
        <div class="flex flex-col justify-between py-2 px-1 bg-black/40">
          <template x-for="i in 8" :key="i">
            <div class="sprocket-hole"></div>
          </template>
        </div>
      </div>

      <!-- Filter chips -->
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-3 px-3">
        <template x-for="(name, key) in filters" :key="key">
          <button @click="filter = key"
            :class="filter === key ? 'bg-amber-500 text-gray-900' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
            class="flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition border border-gray-600">
            <span x-text="name"></span>
          </button>
        </template>
      </div>

      <!-- Mode chips -->
      <div class="flex gap-2 overflow-x-auto pb-1 -mx-3 px-3">
        <button @click="mode = 'single'"
          :class="mode === 'single' ? 'bg-red-500 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
          class="flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition border border-gray-600">
          <i class="ti ti-square inline mr-1"></i> 1 Tấm
        </button>
        <button @click="mode = 'strip3'"
          :class="mode === 'strip3' ? 'bg-red-500 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
          class="flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition border border-gray-600">
          <i class="ti ti-layout-list inline mr-1"></i> Dải 3 Tấm
        </button>
      </div>

      <!-- Controls bottom -->
      <div class="flex items-center justify-between gap-4 py-2">
        <button @click="toggleCamera()"
          :disabled="busy"
          class="w-12 h-12 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-90 disabled:opacity-50 transition flex items-center justify-center border border-gray-600">
          <i class="ti ti-flip-horizontal text-xl text-amber-300"></i>
        </button>

        <button @click="capturePhoto()"
          :disabled="busy"
          class="w-20 h-20 rounded-full bg-gradient-to-br from-amber-300 to-amber-500 active:scale-90 disabled:opacity-50 transition shadow-lg hover:shadow-amber-500/50 flex items-center justify-center">
          <div class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-200 to-amber-400 flex items-center justify-center">
            <i class="ti ti-camera text-gray-900 text-2xl"></i>
          </div>
        </button>

        <button @click="goHome()"
          :disabled="busy"
          class="w-12 h-12 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-90 disabled:opacity-50 transition flex items-center justify-center border border-gray-600">
          <i class="ti ti-home text-xl text-amber-300"></i>
        </button>
      </div>
    </div>

    <!-- ===== RESULT SCREEN ===== -->
    <div id="result-screen" class="screen flex-1 flex flex-col items-center justify-center px-6 py-8 gap-6"
      x-show="currentScreen === 'result'">
      
      <div class="display-font text-4xl font-bold text-amber-100 mb-4">✨ Ảnh Của Bạn</div>

      <!-- Result image frame -->
      <div class="w-full max-w-sm flex-1 flex items-center justify-center rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 p-2 border border-amber-500/30">
        <img id="result-img" alt="Ảnh chụp" 
          class="max-w-full max-h-full rounded-xl shadow-2xl">
      </div>

      <!-- Action buttons -->
      <div class="flex gap-3 w-full">
        <button @click="retakePhoto()"
          class="flex-1 px-6 py-3 rounded-full border-2 border-amber-400 text-amber-300 font-semibold hover:bg-amber-400/10 active:scale-95 transition">
          <i class="ti ti-reload inline mr-2"></i> Chụp Lại
        </button>
        <button @click="downloadPhoto()"
          class="flex-1 px-6 py-3 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-gray-900 font-semibold hover:from-amber-300 hover:to-amber-400 active:scale-95 transition shadow-lg">
          <i class="ti ti-download inline mr-2"></i> Tải Xuống
        </button>
      </div>
    </div>
  </div>

  <script>
    function photoboothApp() {
      return {
        currentScreen: 'start',
        stream: null,
        video: null,
        canvas: null,
        facingMode: 'user',
        isMirrored: true,
        filter: 'none',
        mode: 'single',
        shots: [],
        busy: false,
        errorMessage: '',
        errorSteps: [],
        showCountdown: false,
        countdownNumber: 3,
        
        filters: {
          none: 'Gốc',
          bw: '🖤 Đen Trắng',
          vintage: '🎬 Vintage',
          cool: '❄️ Lạnh',
          warm: '🔥 Ấm'
        },

        init() {
          this.video = document.getElementById('video');
          this.canvas = document.getElementById('canvas');
          this.setupVideoFilter();
        },

        isIOS() {
          return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },

        setupVideoFilter() {
          if (!this.video) return;
          const filterMap = {
            none: 'none',
            bw: 'grayscale(1) contrast(1.12)',
            vintage: 'sepia(.35) saturate(1.3) contrast(1.05) brightness(1.02)',
            cool: 'saturate(1.1) hue-rotate(-10deg) brightness(1.02) contrast(1.05)',
            warm: 'saturate(1.15) hue-rotate(8deg) brightness(1.05) contrast(1.02)'
          };
          this.video.style.filter = filterMap[this.filter];
        },

        showError(title, steps = []) {
          this.errorMessage = title;
          this.errorSteps = steps;
        },

        requestCameraAndEnter() {
          if (!window.isSecureContext) {
            this.showError('Trang chưa chạy trên kết nối an toàn (HTTPS)', 
              ['Camera trên trình duyệt chỉ hoạt động qua https://']);
            return;
          }
          if (!navigator.mediaDevices?.getUserMedia) {
            this.showError('Trình duyệt này không hỗ trợ camera');
            return;
          }
          this.startCamera().catch(err => this.explainError(err));
        },

        startCamera() {
          this.stopStream();
          const constraints = {
            audio: false,
            video: {
              facingMode: this.facingMode,
              width: { ideal: 1920 },
              height: { ideal: 1920 }
            }
          };
          
          return navigator.mediaDevices.getUserMedia(constraints)
            .catch(err => {
              if (err.name === 'OverconstrainedError') {
                return navigator.mediaDevices.getUserMedia({ audio: false, video: true });
              }
              throw err;
            })
            .then(stream => {
              this.stream = stream;
              this.video.srcObject = stream;
              const track = stream.getVideoTracks()[0];
              const settings = track?.getSettings?.();
              this.isMirrored = settings?.facingMode === 'user' || this.facingMode === 'user';
              this.setupVideoFilter();
              this.currentScreen = 'camera';
            });
        },

        explainError(err) {
          const name = err?.name || 'Unknown';
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
            this.showError('Camera bị chặn quyền truy cập', [
              this.isIOS() 
                ? 'Safari &gt; Cài đặt &gt; Camera, chọn "Cho phép"'
                : 'Bấm ổ khóa 🔒 trên thanh địa chỉ &gt; cho phép Camera'
            ]);
          } else if (name === 'NotFoundError') {
            this.showError('Không tìm thấy camera trên thiết bị');
          } else if (name === 'NotReadableError') {
            this.showError('Camera đang được app khác sử dụng');
          } else {
            this.showError(`Lỗi: ${name}`, ['Thử tải lại trang hoặc dùng trình duyệt khác']);
          }
        },

        toggleCamera() {
          if (this.busy) return;
          this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
          this.startCamera().catch(err => this.explainError(err));
        },

        stopStream() {
          if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
          }
        },

        grabFrame() {
          const vw = this.video.videoWidth, vh = this.video.videoHeight;
          const frameW = 900, frameH = 1200;
          const targetRatio = frameW / frameH, srcRatio = vw / vh;
          
          let sx, sy, sw, sh;
          if (srcRatio > targetRatio) {
            sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
          } else {
            sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
          }
          
          const c = document.createElement('canvas');
          c.width = frameW; c.height = frameH;
          const ctx = c.getContext('2d');
          const filterMap = {
            none: 'none',
            bw: 'grayscale(1) contrast(1.12)',
            vintage: 'sepia(.35) saturate(1.3) contrast(1.05) brightness(1.02)',
            cool: 'saturate(1.1) hue-rotate(-10deg) brightness(1.02) contrast(1.05)',
            warm: 'saturate(1.15) hue-rotate(8deg) brightness(1.05) contrast(1.02)'
          };
          ctx.filter = filterMap[this.filter];
          ctx.drawImage(this.video, sx, sy, sw, sh, 0, 0, frameW, frameH);
          return c;
        },

        async capturePhoto() {
          if (this.busy) return;
          this.busy = true;
          this.shots = [];
          const totalShots = this.mode === 'strip3' ? 3 : 1;
          
          const captureShot = async () => {
            await this.countdown(this.shots.length === 0 ? 3 : 2);
            this.fireFlash();
            await new Promise(r => setTimeout(r, 120));
            this.shots.push(this.grabFrame());
            
            if (this.shots.length < totalShots) {
              await captureShot();
            } else {
              this.finishCapture();
            }
          };
          
          await captureShot();
        },

        countdown(seconds) {
          return new Promise(resolve => {
            let n = seconds;
            const tick = () => {
              if (n <= 0) {
                this.showCountdown = false;
                resolve();
              } else {
                this.countdownNumber = n;
                this.showCountdown = true;
                n--;
                setTimeout(tick, 800);
              }
            };
            tick();
          });
        },

        fireFlash() {
          const flash = document.createElement('div');
          flash.className = 'fixed inset-0 bg-white pointer-events-none z-50';
          flash.style.animation = 'fadeOut 0.35s ease-out forwards';
          document.body.appendChild(flash);
          setTimeout(() => flash.remove(), 350);
        },

        composeFinal() {
          const margin = 40, gap = 24, side = 34, footer = 90;
          const frameW = 900, frameH = 1200;
          const n = this.shots.length;
          const W = frameW + side * 2 + margin * 2;
          const H = margin + n * frameH + (n - 1) * gap + margin + footer;

          const c = document.createElement('canvas');
          c.width = W; c.height = H;
          const ctx = c.getContext('2d');

          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, '#241720');
          grad.addColorStop(1, '#170F13');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          let y = margin;
          for (let i = 0; i < n; i++) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect?.(margin + side, y, frameW, frameH, 12) || 
              this.roundRect(ctx, margin + side, y, frameW, frameH, 12);
            ctx.clip();
            ctx.drawImage(this.shots[i], margin + side, y);
            
            const vg = ctx.createRadialGradient(
              margin+side+frameW/2, y+frameH/2, frameH*0.35,
              margin+side+frameW/2, y+frameH/2, frameH*0.75
            );
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(0,0,0,0.22)');
            ctx.fillStyle = vg;
            ctx.fillRect(margin+side, y, frameW, frameH);
            ctx.restore();
            y += frameH + gap;
          }

          ctx.fillStyle = '#F5ECDD';
          ctx.font = '700 34px Outfit, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('📸 PHOTOBOOTH', W/2, H - 46);
          ctx.fillStyle = '#B29C90';
          ctx.font = '500 20px Outfit, sans-serif';
          ctx.fillText(new Date().toLocaleDateString('vi-VN'), W/2, H - 18);

          return c;
        },

        roundRect(ctx, x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x+r, y);
          ctx.arcTo(x+w, y, x+w, y+h, r);
          ctx.arcTo(x+w, y+h, x, y+h, r);
          ctx.arcTo(x, y+h, x, y, r);
          ctx.arcTo(x, y, x+w, y, r);
          ctx.closePath();
        },

        finishCapture() {
          this.stopStream();
          const final = this.composeFinal();
          document.getElementById('result-img').src = final.toDataURL('image/png');
          document.getElementById('result-img').dataset.filename = 
            'photobooth_' + new Date().toISOString().slice(0,19).replace(/[-:]/g,'') + '.png';
          this.busy = false;
          this.currentScreen = 'result';
        },

        downloadPhoto() {
          const img = document.getElementById('result-img');
          const a = document.createElement('a');
          a.href = img.src;
          a.download = img.dataset.filename || 'photobooth.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        },

        retakePhoto() {
          this.shots = [];
          this.startCamera().catch(err => {
            this.explainError(err);
            this.currentScreen = 'start';
          });
        },

        goHome() {
          if (this.busy) return;
          this.stopStream();
          this.currentScreen = 'start';
        }
      };
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeOut { 
        0% { opacity: 1; } 
        100% { opacity: 0; } 
      }
      .text-shadow {
        text-shadow: 0 0 40px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.6);
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
