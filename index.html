<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>✨ Cute Photobooth ✨</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Quicksand', sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .font-cute {
    font-family: 'Fredoka', cursive, sans-serif;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  .animate-float {
    animation: float 3s ease-in-out infinite;
  }
  /* Ẩn thanh cuộn nhưng vẫn vuốt được */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-rose-100 min-h-screen min-h-[100dvh] flex flex-col items-center justify-center text-gray-700 p-3 sm:p-4">

  <div id="app" class="w-full max-w-md bg-white/75 backdrop-blur-xl border border-white/60 shadow-2xl rounded-[32px] flex flex-col overflow-hidden relative min-h-[85vh] sm:min-h-[750px]">

    <!-- ===== START SCREEN ===== -->
    <div class="screen flex-1 flex flex-col items-center justify-center p-6 text-center" id="start-screen">
      <div class="mb-2 inline-flex items-center gap-2 bg-pink-100/90 text-pink-600 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider shadow-sm animate-float">
        ✨ Sparkle & Bunny Photobooth ✨
      </div>
      <h1 class="font-cute text-4xl font-bold text-gray-800 mb-1">Góc Sống ảo</h1>
      <p class="text-xs text-gray-400 mb-6 uppercase tracking-widest">Nhiều hiệu ứng lấp lánh & tai thỏ xinh xắn</p>

      <!-- Khung trang trí -->
      <div class="w-64 aspect-[3/4] rounded-3xl bg-gradient-to-tr from-pink-200 via-purple-200 to-rose-200 p-2 shadow-inner mb-8 relative flex items-center justify-center overflow-hidden border-4 border-white">
        <div class="absolute inset-2 rounded-2xl bg-white/90 flex flex-col items-center justify-center text-pink-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-2 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span class="text-xs font-semibold text-gray-500">Bấm để bắt đầu chụp nào!</span>
        </div>
      </div>

      <button id="btn-start" class="w-full py-4 px-8 bg-gradient-to-r from-pink-400 via-rose-400 to-purple-400 text-white font-bold rounded-2xl shadow-lg shadow-pink-400/40 hover:opacity-95 active:scale-95 transition-all flex items-center justify-center gap-2 text-lg">
        <span>📸</span> Mở Camera Ngay
      </button>

      <div id="error-box" class="hidden mt-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-2xl text-xs text-left w-full"></div>
    </div>

    <!-- ===== CAMERA SCREEN ===== -->
    <div class="screen flex-1 flex flex-col p-4 justify-between" id="camera-screen" style="display:none;">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between px-2 mb-2">
        <div id="shotcount" class="hidden bg-pink-100 text-pink-600 font-bold px-3 py-1 rounded-full text-xs shadow-sm">
          Tấm 1 / 3
        </div>
        <div class="text-xs font-bold text-gray-400 tracking-wider">CUTE PHOTOBOOTH</div>
        <button id="btn-flip" class="w-9 h-9 rounded-full bg-white/80 shadow-md flex items-center justify-center hover:bg-white active:scale-90 transition">
          <svg class="w-4 h-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>

      <!-- Viewfinder -->
      <div class="relative flex-1 rounded-3xl bg-black overflow-hidden shadow-inner border-4 border-white my-1 flex items-center justify-center">
        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
        
        <!-- Đếm ngược -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <span id="countdown" class="font-cute text-8xl text-white drop-shadow-[0_4px_12px_rgba(236,72,153,0.8)] animate-bounce"></span>
        </div>
      </div>

      <!-- Bộ lọc (Filters) Mở rộng -->
      <div class="flex gap-2 overflow-x-auto py-2 px-1 no-scrollbar" id="filter-row">
        <button class="chip active flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-pink-500 text-white shadow-sm transition" data-filter="none">✨ Gốc</button>
        <button class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition" data-filter="softpink">🌸 Hồng Ngọt</button>
        <button class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition" data-filter="sparkle">💫 Lấp Lánh</button>
        <button class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition" data-filter="bunny">🐰 Tai Thỏ Xinh</button>
        <button class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition" data-filter="vintage">🎞️ Vintage</button>
        <button class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition" data-filter="cool">🧊 Tone Lạnh</button>
      </div>

      <!-- Chế độ chụp -->
      <div class="flex justify-center gap-4 py-1" id="mode-row">
        <button class="chip active px-4 py-1 rounded-full text-xs font-semibold bg-purple-500 text-white shadow-sm" data-mode="single">📷 1 Tấm</button>
        <button class="chip px-4 py-1 rounded-full text-xs font-semibold bg-white/60 text-gray-500 shadow-sm" data-mode="strip3">🎞️ Dải 3 Tấm</button>
      </div>

      <!-- Nút điều hướng dưới cùng -->
      <div class="flex items-center justify-around pt-2">
        <button id="btn-home" class="w-11 h-11 rounded-full bg-white/80 shadow-md flex items-center justify-center hover:bg-white active:scale-90 transition" title="Về trang chủ">
          <svg class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </button>

        <!-- Nút chụp -->
        <button id="btn-shutter" class="w-18 h-18 rounded-full bg-gradient-to-tr from-pink-400 to-rose-400 p-1.5 shadow-lg shadow-pink-400/50 active:scale-90 transition flex items-center justify-center">
          <div class="w-full h-full rounded-full border-4 border-white bg-gradient-to-br from-pink-300 to-rose-500 flex items-center justify-center">
            <span class="text-white text-2xl">💖</span>
          </div>
        </button>

        <div class="w-11"></div>
      </div>
    </div>

    <!-- ===== RESULT SCREEN ===== -->
    <div class="screen flex-1 flex flex-col items-center justify-between p-6 text-center" id="result-screen" style="display:none;">
      <h2 class="font-cute text-2xl font-bold text-gray-800">🎉 Xinh quá đi mất!</h2>
      
      <div class="flex-1 my-3 w-full flex items-center justify-center overflow-hidden py-1">
        <img id="result-img" class="max-h-[380px] max-w-full rounded-2xl shadow-xl border-4 border-white object-contain" alt="Ảnh photobooth">
      </div>

      <div class="flex gap-3 w-full pt-2">
        <button id="btn-retake" class="flex-1 py-3 px-4 bg-white/80 border border-gray-200 text-gray-600 font-bold rounded-2xl shadow-sm hover:bg-white active:scale-95 transition">
          🔄 Chụp Lại
        </button>
        <button id="btn-download" class="flex-1 py-3 px-4 bg-gradient-to-r from-pink-400 to-rose-500 text-white font-bold rounded-2xl shadow-lg shadow-pink-400/40 active:scale-95 transition flex items-center justify-center gap-2">
          <span>📥</span> Tải Ảnh Về
        </button>
      </div>
    </div>

    <!-- Flash Overlay -->
    <div id="flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-200 z-50"></div>
  </div>

<script>
(function(){
  "use strict";

  var BRAND_TEXT = "✨ CUTE VIBES ✨";
  var FRAME_W = 900, FRAME_H = 1200;      
  var FILTERS = {
    none:     'none',
    softpink: 'saturate(1.2) brightness(1.05) contrast(1.02) sepia(0.15)',
    sparkle:  'saturate(1.25) contrast(1.08) brightness(1.04)',
    bunny:    'saturate(1.2) brightness(1.05)',
    vintage:  'sepia(.35) saturate(1.3) contrast(1.05) brightness(1.02)',
    cool:     'saturate(1.1) hue-rotate(-10deg) brightness(1.02) contrast(1.05)'
  };

  var state = {
    stream: null,
    facingMode: 'user',
    filter: 'none',
    mode: 'single',
    shots: [],          
    busy: false
  };

  var els = {
    startScreen: document.getElementById('start-screen'),
    cameraScreen: document.getElementById('camera-screen'),
    resultScreen: document.getElementById('result-screen'),
    btnStart: document.getElementById('btn-start'),
    video: document.getElementById('video'),
    canvas: document.getElementById('canvas'),
    countdown: document.getElementById('countdown'),
    flash: document.getElementById('flash'),
    shutter: document.getElementById('btn-shutter'),
    btnFlip: document.getElementById('btn-flip'),
    btnHome: document.getElementById('btn-home'),
    filterRow: document.getElementById('filter-row'),
    modeRow: document.getElementById('mode-row'),
    shotcount: document.getElementById('shotcount'),
    resultImg: document.getElementById('result-img'),
    btnRetake: document.getElementById('btn-retake'),
    btnDownload: document.getElementById('btn-download'),
    errorBox: document.getElementById('error-box')
  };

  function showScreen(name){
    els.startScreen.style.display  = name === 'start'  ? 'flex' : 'none';
    els.cameraScreen.style.display = name === 'camera' ? 'flex' : 'none';
    els.resultScreen.style.display = name === 'result' ? 'flex' : 'none';
  }

  function showError(title, steps){
    var html = '<b class="block mb-1">⚠️ ' + title + '</b>';
    if (steps && steps.length){
      html += '<ul class="list-disc pl-4 space-y-1">' + steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ul>';
    }
    els.errorBox.innerHTML = html;
    els.errorBox.classList.remove('hidden');
  }

  function clearError(){
    els.errorBox.classList.add('hidden');
    els.errorBox.innerHTML = '';
  }

  function explainGetUserMediaError(err){
    var name = err && err.name ? err.name : 'UnknownError';
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      showError('Trình duyệt đang chặn camera', [
        'Vào Cài đặt (Settings) > Safari > mục Camera chọn "Cho phép".',
        'Hoặc bấm vào biểu tượng "aA" trên thanh địa chỉ Safari > Website Settings > bật Camera.'
      ]);
    } else {
      showError('Không mở được camera (' + name + ')', ['Hãy kiểm tra lại quyền truy cập hoặc thử tải lại trang.']);
    }
  }

  function stopStream(){
    if (state.stream){
      state.stream.getTracks().forEach(function(t){ t.stop(); });
      state.stream = null;
    }
  }

  function openCameraStream(){
    var idealConstraints = {
      audio: false,
      video: {
        facingMode: state.facingMode,
        width:  { ideal: 1920 },
        height: { ideal: 1920 }
      }
    };
    return navigator.mediaDevices.getUserMedia(idealConstraints).catch(function(err){
      if (err && (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError')){
        return navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      }
      throw err;
    });
  }

  function startCamera(){
    stopStream();
    return openCameraStream().then(function(stream){
      state.stream = stream;
      els.video.srcObject = stream;
      var track = stream.getVideoTracks()[0];
      var settings = track && track.getSettings ? track.getSettings() : {};
      els.video.classList.toggle('scale-x-[-1]', settings.facingMode ? settings.facingMode === 'user' : state.facingMode === 'user');
      els.video.style.filter = FILTERS[state.filter];
    });
  }

  function requestCameraAndEnter(){
    if (!window.isSecureContext){
      explainGetUserMediaError({ name: 'SecurityError' });
      return;
    }
    clearError();
    startCamera().then(function(){
      showScreen('camera');
    }).catch(function(err){
      explainGetUserMediaError(err || {});
    });
  }

  els.btnStart.addEventListener('click', requestCameraAndEnter);

  els.btnFlip.addEventListener('click', function(){
    if (state.busy) return;
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    startCamera().catch(function(err){
      explainGetUserMediaError(err || {});
    });
  });

  els.btnHome.addEventListener('click', function(){
    if (state.busy) return;
    stopStream();
    showScreen('start');
  });

  els.filterRow.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if (!chip || state.busy) return;
    Array.prototype.forEach.call(els.filterRow.children, function(c){ 
      c.className = "chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-white/80 text-gray-600 shadow-sm transition";
    });
    chip.className = "chip flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-pink-500 text-white shadow-sm transition";
    state.filter = chip.getAttribute('data-filter');
    els.video.style.filter = FILTERS[state.filter];
  });

  els.modeRow.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if (!chip || state.busy) return;
    Array.prototype.forEach.call(els.modeRow.children, function(c){ 
      c.className = "chip px-4 py-1 rounded-full text-xs font-semibold bg-white/60 text-gray-500 shadow-sm";
    });
    chip.className = "chip px-4 py-1 rounded-full text-xs font-semibold bg-purple-500 text-white shadow-sm";
    state.mode = chip.getAttribute('data-mode');
  });

  // Vẽ hình ngôi sao lấp lánh lên canvas
  function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    var rot = Math.PI / 2 * 3;
    var x = cx, y = cy;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (var i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#fde047';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0; // reset
  }

  // Vẽ tai thỏ đáng yêu lên đỉnh đầu người chụp
  function drawBunnyEars(ctx, w, h) {
    ctx.save();
    // Tai trái
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.ellipse(w * 0.35, h * 0.16, w * 0.08, h * 0.18, -0.15, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Lòng trong tai trái (màu hồng)
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath();
    ctx.ellipse(w * 0.35, h * 0.16, w * 0.04, h * 0.11, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // Tai phải
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(w * 0.65, h * 0.16, w * 0.08, h * 0.18, 0.15, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Lòng trong tai phải
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath();
    ctx.ellipse(w * 0.65, h * 0.16, w * 0.04, h * 0.11, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function grabFrame(){
    var vw = els.video.videoWidth, vh = els.video.videoHeight;
    var targetRatio = FRAME_W / FRAME_H;
    var srcRatio = vw / vh;
    var sx, sy, sw, sh;
    if (srcRatio > targetRatio){
      sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
    } else {
      sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
    }
    var c = document.createElement('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    var ctx = c.getContext('2d');
    ctx.filter = FILTERS[state.filter];
    ctx.drawImage(els.video, sx, sy, sw, sh, 0, 0, FRAME_W, FRAME_H);
    
    // Tắt filter trước khi vẽ các hiệu ứng đồ hoạ phụ trợ
    ctx.filter = 'none';

    // Thêm hiệu ứng lấp lánh nếu chọn bộ lọc sparkle
    if (state.filter === 'sparkle') {
      drawStar(ctx, FRAME_W * 0.15, FRAME_H * 0.2, 4, 30, 12);
      drawStar(ctx, FRAME_W * 0.82, FRAME_H * 0.15, 4, 35, 14);
      drawStar(ctx, FRAME_W * 0.88, FRAME_H * 0.75, 4, 25, 10);
      drawStar(ctx, FRAME_W * 0.12, FRAME_H * 0.8, 4, 28, 11);
    }

    // Thêm tai thỏ nếu chọn bộ lọc bunny
    if (state.filter === 'bunny') {
      drawBunnyEars(ctx, FRAME_W, FRAME_H);
    }

    return c;
  }

  function fireFlash(){
    els.flash.style.opacity = '1';
    setTimeout(function(){
      els.flash.style.opacity = '0';
    }, 200);
  }

  function countdownThen(seconds, cb){
    var n = seconds;
    function tick(){
      if (n <= 0){ els.countdown.innerHTML = ''; cb(); return; }
      els.countdown.innerHTML = n;
      n--;
      setTimeout(tick, 800);
    }
    tick();
  }

  function updateShotCount(){
    if (state.mode !== 'strip3'){ els.shotcount.classList.add('hidden'); return; }
    els.shotcount.classList.remove('hidden');
    els.shotcount.textContent = 'Tấm ' + (state.shots.length + 1) + ' / 3';
  }

  els.shutter.addEventListener('click', function(){
    if (state.busy) return;
    state.busy = true;
    els.shutter.setAttribute('disabled', 'true');
    state.shots = [];
    var totalShots = state.mode === 'strip3' ? 3 : 1;

    function nextShot(){
      updateShotCount();
      countdownThen(state.shots.length === 0 ? 3 : 2, function(){
        fireFlash();
        setTimeout(function(){
          state.shots.push(grabFrame());
          if (state.shots.length < totalShots){
            nextShot();
          } else {
            finishCapture();
          }
        }, 120);
      });
    }
    nextShot();
  });

  function timestamp(){
    var d = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '' + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function drawSprocketColumn(ctx, x, top, bottom, holeW, holeH, gap){
    var y = top;
    while (y + holeH <= bottom){
      ctx.fillStyle = '#fff';
      roundRect(ctx, x, y, holeW, holeH, 3);
      ctx.fill();
      y += holeH + gap;
    }
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function composeFinal(){
    var margin = 40, gap = 24, side = 34, footer = 90;
    var n = state.shots.length;
    var W = FRAME_W + side * 2 + margin * 2;
    var H = margin + n * FRAME_H + (n - 1) * gap + margin + footer;

    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');

    // Background pastel hồng/tím xinh xắn
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fbcfe8'); 
    grad.addColorStop(0.5, '#e9d5ff'); 
    grad.addColorStop(1, '#fecdd3'); 
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, W, H, 26); ctx.fill();

    var y = margin;
    for (var i = 0; i < n; i++){
      ctx.save();
      roundRect(ctx, margin + side, y, FRAME_W, FRAME_H, 12);
      ctx.clip();
      ctx.drawImage(state.shots[i], margin + side, y);
      ctx.restore();
      y += FRAME_H + gap;
    }

    var photosBottom = margin + n * FRAME_H + (n - 1) * gap;
    drawSprocketColumn(ctx, margin + 10, margin, photosBottom, 14, 22, 16);
    drawSprocketColumn(ctx, margin + side + FRAME_W + 10, margin, photosBottom, 14, 22, 16);

    // Footer text
    ctx.fillStyle = '#831843';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(BRAND_TEXT, W/2, H - 46);
    
    ctx.fillStyle = '#9d174d';
    ctx.font = '20px sans-serif';
    var d = new Date();
    ctx.fillText(d.toLocaleDateString('vi-VN'), W/2, H - 18);

    return c;
  }

  function finishCapture(){
    stopStream();
    var final = composeFinal();
    els.resultImg.src = final.toDataURL('image/png');
    els.resultImg.dataset.filename = 'cute_photobooth_' + timestamp() + '.png';
    state.busy = false;
    els.shutter.removeAttribute('disabled');
    showScreen('result');
  }

  els.btnDownload.addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = els.resultImg.src;
    a.download = els.resultImg.dataset.filename || 'photobooth.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  els.btnRetake.addEventListener('click', function(){
    startCamera().then(function(){
      showScreen('camera');
    }).catch(function(err){
      explainGetUserMediaError(err || {});
      showScreen('start');
    });
  });

})();
</script>
</body>
</html>
